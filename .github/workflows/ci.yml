name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON
        run: |
          for f in .claude-plugin/plugin.json hooks/hooks.json; do
            jq empty "$f" && echo "ok: $f"
          done

      - name: Shell syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done

      # Gated at error severity so style opinions cannot turn the badge red.
      # Tighten to -S warning once the codebase has been checked locally.
      - name: ShellCheck
        run: shellcheck -S error scripts/*.sh tests/*.sh

      - name: Regression tests
        run: bash tests/run.sh
